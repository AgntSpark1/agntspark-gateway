services:
  postgres:
    # pgvector/pgvector ships Postgres 16 with the pgvector extension
    # pre-built — a drop-in replacement for postgres:16 today, and ready
    # for embedding-backed agent memory/RAG features without standing up
    # a second database. See alembic/versions/0003_pgvector.py, which
    # enables the extension (nothing uses it yet — see README).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agntspark
      POSTGRES_PASSWORD: agntspark
      POSTGRES_DB: agntspark_gateway
    ports:
      - "5432:5432"
    volumes:
      - agntspark_gateway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agntspark"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - agntspark_gateway_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
    environment:
      AGNTSPARK_GATEWAY_DATABASE_URL: postgresql+asyncpg://agntspark:agntspark@postgres:5432/agntspark_gateway
      AGNTSPARK_GATEWAY_JWT_SECRET: dev-secret-change-me
      AGNTSPARK_GATEWAY_REDIS_URL: redis://redis:6379/0
      # The gateway launches agent containers as *siblings* on the host's
      # Docker daemon (not nested inside itself) — hence mounting the host
      # socket below rather than running a Docker-in-Docker setup.
      AGNTSPARK_GATEWAY_DOCKER_SOCKET: unix:///var/run/docker.sock
      AGNTSPARK_GATEWAY_DOCKER_NETWORK: agntspark-net
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - agntspark-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - agntspark_gateway_grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  agntspark_gateway_pgdata:
  agntspark_gateway_redisdata:
  agntspark_gateway_grafanadata:

networks:
  agntspark-net:
    name: agntspark-net
