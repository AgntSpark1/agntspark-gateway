[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agntspark-gateway"
version = "0.1.0"
description = "API Gateway + Auth service for the AgntSpark AI Agent hosting platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AgntSpark LLC", email = "dev@agntspark.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.9.0",
    "cryptography>=42.0.0",
    "docker>=7.1.0",
    "sse-starlette>=2.1.0",
    "redis>=5.1.0",
    "structlog>=24.4.0",
    "agntspark-core[runtime] @ git+https://github.com/AgntSpark1/agntspark-core.git@f5947a8d772d7d194eb834a5fe785174bd834469",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "fakeredis>=2.24.0",
]

[project.scripts]
agntspark-gateway = "agntspark_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agntspark_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests that require external services (Postgres)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agntspark_gateway", "tests", "scripts"]

[tool.ruff.lint]
# NOTE: deliberately omits "TCH"/"TC" (type-checking-only imports) — with
# `from __future__ import annotations`, FastAPI still resolves route and
# Depends() annotations at runtime via `typing.get_type_hints()`, so moving
# those imports (AsyncSession, Principal, etc.) into `if TYPE_CHECKING:`
# blocks would raise NameError on app startup. This is a known conflict
# between that ruff rule and FastAPI-style runtime type resolution.
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "B008",  # Depends()/Security() in argument defaults is the required FastAPI idiom
    "UP042",  # `class X(str, Enum)` matches agntspark_core's own enum style — kept consistent
]

[tool.ruff.lint.per-file-ignores]
# Pydantic response fields are deliberately camelCase (keyPreview, createdAt,
# ...) to match agntspark-console's TypeScript types byte-for-byte.
"agntspark_gateway/schemas/*.py" = ["N815"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agntspark_gateway"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
