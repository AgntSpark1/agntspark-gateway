name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.7.0"

      - name: Lint with ruff
        run: ruff check agntspark_gateway/ tests/ scripts/

      - name: Format check with ruff
        run: ruff format --check agntspark_gateway/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match docker-compose.yml's Postgres image — migration 0003
        # enables the pgvector extension, which plain postgres:16 lacks.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agntspark
          POSTGRES_PASSWORD: agntspark
          POSTGRES_DB: agntspark_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agntspark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AGNTSPARK_GATEWAY_DATABASE_URL: postgresql+asyncpg://agntspark:agntspark@localhost:5432/agntspark_gateway_test
      AGNTSPARK_GATEWAY_JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests with pytest
        run: pytest --cov=agntspark_gateway --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agntspark/gateway:ci .
